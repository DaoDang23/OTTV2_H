spring.application.name=ottv2-api
# Infrastructure is started separately with the repository-root compose.yaml.
spring.docker.compose.enabled=false
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ottv2}
spring.datasource.username=${DATABASE_USER:ottv2}
spring.datasource.password=${DATABASE_PASSWORD:ottv2-local}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=always
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=${MANAGEMENT_BIND_ADDRESS:0.0.0.0}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:ottv2}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:ottv2-local}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.template.mandatory=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
ottv2.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
ottv2.storage.access-key=${MINIO_ROOT_USER:ottv2}
ottv2.storage.secret-key=${MINIO_ROOT_PASSWORD:ottv2-local-secret}
ottv2.storage.bucket=${MINIO_BUCKET:ottv2}
ottv2.submissions.max-source-bytes=${SUBMISSION_MAX_BYTES:262144}
ottv2.submissions.cooldown-seconds=${SUBMISSION_COOLDOWN_SECONDS:30}
ottv2.submissions.daily-limit=${SUBMISSION_DAILY_LIMIT:50}
ottv2.ladder.poll-ms=${LADDER_POLL_MS:5000}
ottv2.ladder.presence-ttl-seconds=${LADDER_PRESENCE_TTL_SECONDS:120}
ottv2.ladder.max-matches-per-minute=${LADDER_MAX_MATCHES_PER_MINUTE:2}
ottv2.ladder.matchmaking.initial-window=${LADDER_MATCHMAKING_INITIAL_WINDOW:150}
ottv2.ladder.matchmaking.expansion-per-minute=${LADDER_MATCHMAKING_EXPANSION:50}
ottv2.ladder.matchmaking.max-window=${LADDER_MATCHMAKING_MAX_WINDOW:300}
ottv2.ladder.k-factor=${LADDER_K_FACTOR:32}
ladder.rating.k-factor=${LADDER_K_FACTOR:32}
ottv2.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

