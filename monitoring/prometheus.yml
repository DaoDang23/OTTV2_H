global:
  scrape_interval: 15s

scrape_configs:
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: ottv2-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: ottv2-match-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9404"]
